name: launch-named-sandbox

on:
  push:
    paths:
      - .github/workflows/launch-named-sandbox.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sandbox:
    uses: ./.github/workflows/start-sandbox.yml
    with:
      duration_minutes: "15"
      permission_mode: trusted
      checkout_repository: true
      tunnel_type: named
      tunnel_hostname: mcp.minhndn.tech
      hide_auth_token: true
    secrets: inherit
